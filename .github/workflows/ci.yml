name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AirPods.sln

      - name: Build
        run: dotnet build AirPods.sln -c Release --no-restore

      - name: Test
        run: dotnet test AirPods.sln -c Release --no-build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Task tracker is consistent
        run: python scripts/check_tasks.py
